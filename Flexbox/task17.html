<!DOCTYPE html>
<html lang="en">
<head>

            border-radius: 10px;

        <div class="card">
            <h2>Product</h2>
            <p>Name:Pizza</p>
            <p>Price:2300Rs</p>
        </div>
        <div class="card">
            <h2>Product</h2>
            <p>Name:Wings</p>
            <p>Price:2300Rs</p>
        </div>
    </div>
</body>
</html>
