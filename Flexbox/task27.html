<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Content Center</title>

    <style>
        .container {
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: space-evenly;
            background-color: palevioletred;
            height: 50vh;
            gap: 20px;
            padding: 10px;
        }

        .card {
            background-color: aliceblue;
            padding: 20px;
            border-radius: 10px;
            width: 150px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h2>Burger</h2>
            <p>Price: 2300Rs</p>
        </div>

        <div class="card">
            <h2>Pizza</h2>
            <p>Price: 2300Rs</p>
        </div>

        <div class="card">
            <h2>Wings</h2>
            <p>Price: 2300Rs</p>
        </div>

        <div class="card">
            <h2>Noodles</h2>
            <p>Price: 2300Rs</p>
        </div>

        <div class="card">
            <h2>Rice</h2>
            <p>Price: 2300Rs</p>
        </div>

        <div class="card">
            <h2>Sandwich</h2>
            <p>Price: 2300Rs</p>
        </div>
    </div>

</body>
</html>
