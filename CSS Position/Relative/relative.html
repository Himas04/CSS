<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ralative</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- reate a box and move it 20px right using position: relative. -->
     <div class="box">Hello</div><hr>

     <!-- Create a button and shift it slightly using relative positioning. -->
      <button>Click ME!!</button><hr>

      <!-- Overlay a label slightly over a card using relative position. -->
         <div class="card">
        <div class="label">New</div>
        <h2>Product Card</h2>
        <p>This is a simple product description.</p>
    </div>

    <!-- Create two overlapping boxes using relative positioning. -->
       <div class="boxx box1">Box 1</div>
    <div class="boxx box2">Box 2</div><hr>

    <!-- Shift heading text using relative positioning. -->
     <div class="head">
        <h1>This is a heading</h1>
     </div><hr>

     <!-- Create a navigation item and adjust its position using relative -->
        <nav>
            <ul>
                <li class="nav-item">Home</li>
                <li class="nav-item">About</li>
                <li class="nav-item">Contact</li>
            </ul>
        </nav><hr>

        <!-- Create a tooltip base using relative positioning. -->
        <div class="tooltip">
            <span class="tooltiptext">This is a tooltip</span>
        </div><hr>
</body>
</html>
