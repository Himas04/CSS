<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absolute Position Tasks</title>

    <link rel="stylesheet" href="styleS.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body>
    <!-- 1. Box at Top Left -->
    <div class="container">
      <div class="box1">Coming Soon!</div>
      <div class="box2">Now It's Time</div>
    </div>

    <hr />

    <!-- 2. Card with NEW Badge -->
    <div class="card">
      <span class="badge">NEW</span>
      <h3>Keyboard</h3>
      <p>Price: Rs. 5000</p>
      <button>Add to Cart</button>
    </div>

    <hr />

    <!-- 3. Close Button -->
    <div class="modal">
      <span class="close">&times;</span>
      <h3>Notification</h3>
      <p>This is a sample modal box.</p>
    </div>

    <hr />

    <!-- 4. Image with Price Tag -->
    <div class="image-card">
      <img src="https://picsum.photos/300/200" alt="Product" />
      <span class="price">Rs.19999</span>
    </div>

    <hr />

    <!-- 5. Dropdown Menu -->
    <div class="dropdown">
      <button class="btn">Menu</button>
      <div class="dropdown-content">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
      </div>
    </div>

    <hr />

    <!-- 6. Tooltip -->
    <div class="tooltip">
      Hover Me
      <span class="tooltip-text">Hello! I'm a Tooltip.</span>
    </div>

    <hr />

    <!-- 7. Notification Badge -->
    <div class="notify">
      <i class="fa-solid fa-bell"></i>
      <span class="count">5</span>
    </div>

    <hr />

    <!-- 8. Multiple Icons -->
    <div class="icon-box">
      <i class="fa-solid fa-house home"></i>
      <i class="fa-solid fa-user user"></i>
      <i class="fa-solid fa-gear setting"></i>
    </div>

    <hr />

    <!-- 9. Floating Button -->
    <div class="float-container">
      <button class="float-btn">+</button>
    </div>

    <hr />

    <!-- 10. Login Card -->
    <div class="login-card">
      <span class="corner">VIP</span>
      <h3>Login</h3>
      <input type="text" placeholder="Username" /><br /><br />
      <input type="password" placeholder="Password" /><br /><br />
      <button>Login</button>
    </div>
    <hr />

    <!-- Create a parent container with relative and child with absolute. -->
    <div class="parent">
      Parent Container
      <div class="child">Child Box</div>
    </div>
    <hr />

    <!-- Build a profile card with image badge using both positions. -->
    <div class="profile-card">
      <div class="image-box">
        <img src="Stu.jpg" alt="Profile" />

        <span class="badge">✔</span>
      </div>

      <h2>Himas</h2>
      <p>Web Developer</p>

      <button>View Profile</button>
    </div>
    <hr />

    <!-- Build a tooltip that appears over a button. -->
    <div class="tooltip-box">
      <button class="btn">Hover Me</button>
      <span class="tooltip">Click to Submit</span>
    </div>
  </body>
</html>
