<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f0f0f0;
        }

        .login-form{
            width:300px;
            padding:20px;
            background:white;
            border-radius:10px;
            box-shadow:0 4px 10px rgba(0,0,0,0.3);
            display:flex;
            flex-direction:column;
            gap:15px;
        }

        .login-form h2{
            text-align:center;
        }

        .login-form input{
            padding:10px;
            font-size:16px;
        }

        .login-form button{
            padding:10px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .login-form button:hover{
            background:darkblue;
        }
    </style>
</head>
<body>

    <form class="login-form">
        <h2>Login</h2>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button type="submit">Login</button>
    </form>

</body>
</html>
