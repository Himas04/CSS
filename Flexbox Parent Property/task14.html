<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Parent Property</title>
    <style>
        .container{
            display: flex;
            justify-content: space-evenly;
            gap: 30px;
            padding: 10px;
            margin: 2%;
            background-color: rgb(197, 197, 54);
            border-radius: 10px;
           box-shadow: 2px 3px 10px rgba(0, 0, 100, 0.888);
        }
        .container .box{
            width: 40px;
            height: 20px;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: whitesmoke;
            border-radius: 25%;
            box-shadow: 2px 3px 17px rgba(103, 152, 18, 0.9);

        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">🔍 Search</div>
        <div class="box"> 📤Filter</div>
        <div class="box">⚙️ Export</div>
        <div class="box">⚙️ Setting</div>

    </div>
</body>
</html>
