<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Parent Property</title>
    <style>
        .container{
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            height: 80vh;
            background-color: yellowgreen;
        }
        .container .circle{
            background-color: brown;
            border-radius: 50%;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="circle">🤡</div>
        <div class="circle">🤷</div>
        <div class="circle">😀</div>
    </div>
</body>
</html>
