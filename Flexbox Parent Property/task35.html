<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Parent Property</title>
    <style>
        .container{
            display: flex;
            justify-content: space-evenly;
            align-items: flex-end;
            flex-wrap: wrap;
            background-color: wheat;
            height: 100vh;
        }
        .container .box{
            width: 100px;
            height: 100px;
            background-color: tomato;
            padding: 10px;
            border-radius: 5px;
            margin: 1%;
        }
        .container .box:hover{
            padding: 15px;
            box-shadow: 2px 3px 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
