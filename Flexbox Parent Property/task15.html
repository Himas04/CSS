<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Menu</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            margin: 20px;
            background: yellow;
            border-radius: 10px;
            box-shadow: 2px 3px 10px rgba(0,0,0,0.3);
        }

        img{
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .dropdown{
            position: relative;
            background-color: wheat;
            padding: 10px;
            border-radius: 5px;
            filter: drop-shadow(2px 3px 5px);

        }

        .dropbtn{
            text-decoration: none;
            color: black;
            font-size: 20px;
            font-weight: bold;
            padding: 10px;
        }

        .dropdown-content{
            display: none;
            position: absolute;
            margin-top: 1%;
            top: 100%;
            right: 0;
            background: white;
            min-width: 180px;
            border-radius: 8px;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        .dropdown-content a{
            display: block;
            padding: 12px;
            text-decoration: none;
            color: black;
        }

        .dropdown-content a:hover{
            background: lightgray;
        }

        .dropdown:hover .dropdown-content{
            display: block;
        }

    </style>
</head>
<body>

<div class="navbar">
    <img src="batman-sign-black-background-dc-superheroes-amoled-5k-8k-10k-3840x2160-4409.jpg" alt="Logo">

    <div class="dropdown">
        <a href="#" class="dropbtn">Menu</a>

        <div class="dropdown-content">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Gallery</a>
            <a href="#">Contact</a>
        </div>
    </div>

</div>

</body>
</html>
