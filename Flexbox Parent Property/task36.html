<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Parent Property</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

.dashboard{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items: center;
    flex-direction: column;
    gap:20px;
    padding:30px;
}

.widget{
    width:220px;
    height:130px;
    background:white;
    border-radius:10px;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition: 0.3 ease-in-out;
}
.widget:hover{
    transform: scale(1.09);
    box-shadow: 1px 4px 16px;
}

.widget h3{
    color:#333;
    margin-bottom:10px;
}

.widget p{
    font-size:24px;
    font-weight:bold;
    color:steelblue;
}
</style>
</head>
<body>

<div class="dashboard">

    <div class="widget">
        <h3>Total Users</h3>
        <p>12,540</p>
    </div>

    <div class="widget">
        <h3>Revenue</h3>
        <p>$24,800</p>
    </div>

    <div class="widget">
        <h3>Orders</h3>
        <p>1,245</p>
    </div>

    <div class="widget">
        <h3>Products</h3>
        <p>320</p>
    </div>

    <div class="widget">
        <h3>Visitors</h3>
        <p>8,950</p>
    </div>

    <div class="widget">
        <h3>Messages</h3>
        <p>56</p>
    </div>

    <div class="widget">
        <h3>Notifications</h3>
        <p>18</p>
    </div>

    <div class="widget">
        <h3>Tasks</h3>
        <p>24</p>
    </div>

    <div class="widget">
        <h3>Completed</h3>
        <p>91%</p>
    </div>

    <div class="widget">
        <h3>Sales Today</h3>
        <p>$1,280</p>
    </div>

    <div class="widget">
        <h3>Support Tickets</h3>
        <p>14</p>
    </div>

    <div class="widget">
        <h3>Server Status</h3>
        <p>Online ✅</p>
    </div>

</div>

</body>
</html>
