<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 200px 200px;
            grid-template-rows: 100px 100px 100px 100px 100px;
            background-color: antiquewhite;
            padding: 10px;
            gap: 10px;
        }
        .container div{
            background-color: tomato;
            border-radius: 5px; 
            padding: 10px;
        }
        .item1{
            /* grid-column-start: 1;
            grid-column-end:2 ; */
            grid-column: 1/span 1;
        }
        .item2{
            /* grid-column-start: 2;
            grid-column-end: 4;

            grid-row-start: 1;
            grid-row-end:3 ; */

            grid-column: 2/ span 3;
            grid-row: 1/span 2;
        }
        .item3{
            /* grid-column-start: 1;
            grid-column-end:2 ;

             grid-row-start: 2;
            grid-row-end:4 ; */

            grid-column: 1/ span 1;
            grid-row: 2/span 2;
        }
        .item4{
            /* grid-column-start:2 ;
            grid-column-end:3 ; */

            grid-column: 2/span 1;
            grid-row: 3/ span 1;
        }

        .item5{
            /* grid-column-start: 3;
            grid-column-end:4;

             grid-row-start: 3;
            grid-row-end:5 ; */

            grid-column: 3 /span 1;
            grid-row: 3/span 2;
        }
         .item6{
            /* grid-column-start: 1;
            grid-column-end:3;

             grid-row-start: 4;
            grid-row-end:6 ; */

            grid-column:1/ span 2 ;
            grid-row:4/span 2 ;
        }
        .item7{
            /* grid-column-start: 3;
            grid-column-end:4;

             grid-row-start: 5;
            grid-row-end:6 ; */

            grid-column: 3 / span 1;
            grid-row: 5/ span 1;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="item1">Item1</div>
            <div class="item2">Item2</div>
            <div class="item3">Item3</div>
            <div class="item4">Item4</div>
            <div class="item5">Item5</div>
            <div class="item6">Item6</div>
            <div class="item7">Item7</div>
        
    </div>
</body>
</html>
