<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Different Height Cards</title>

<style>
    .container {
        display: flex;
        gap: 20px;
        justify-content: center;
        align-items: flex-start;
    }

    .card {
        width: 200px;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 5px 5px 15px gray;
    }

    .card img {
        width: 100px;
        height: 100px;
        border-radius: 50%;
    }

    .card1 {
        background-color: lightblue;
    }

    .card2 {
        background-color: lightgreen;
    }

    .card3 {
        background-color: lightpink;
    }

</style>
</head>

<body>

<div class="container">

    <div class="card card1">
        <h2>Batman</h2>
        <img src="batman-sign-black-background-dc-superheroes-amoled-5k-8k-10k-3840x2160-4409.jpg" alt="">
        <p>Name: Batman</p>
        <p>Skill: Active in Night</p>
    </div>


    <div class="card card2">
        <h2>Superman</h2>
        <img src="batman-sign-black-background-dc-superheroes-amoled-5k-8k-10k-3840x2160-4409.jpg" alt="">
        <p>Name: Superman</p>
        <p>Skill: Flying, Strength, Speed</p>
        <p>Power: Heat Vision</p>
    </div>


    <div class="card card3">
        <h2>Ironman</h2>
        <img src="batman-sign-black-background-dc-superheroes-amoled-5k-8k-10k-3840x2160-4409.jpg" alt="">
        <p>Name: Ironman</p>
        <p>Skill: Technology</p>
        <p>Power: Armor Suit</p>
        <p>Weapon: AI System</p>
        <p>Ability: Flight</p>
    </div>

</div>

</body>
</html>
