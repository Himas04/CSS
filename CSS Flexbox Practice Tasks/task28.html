<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Container Basics</title>
    <style>
     .container {
    display: flex;
    justify-content: space-evenly;
    align-items: baseline;
    height: 100vh;
    gap: 20px;
}

.box {
    width: 100px;
    padding: 50px;
    border-radius: 25%;
    color: white;
    text-align: center;
}

.box1 {
    background-color: red;
    font-size: 20px;
}

.box2 {
    background-color: blue;
    font-size: 40px;
}

.box3 {
    background-color: green;
    font-size: 60px;
}

.box4 {
    background-color: orange;
    font-size: 30px;
}

.box5 {
    background-color: purple;
    font-size: 15px;
}

      
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1">HIIIIII</div>
      <div class="box box2">HIIIIII</div>
      <div class="box box3">HIIIIII</div>
      <div class="box box4">HIIIIII</div>
      <div class="box box5">HIIIIII</div>
      
    </div>
  </body>
</html>
