<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Container Basics</title>
    <style>
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-wrap: wrap;
        gap: 20px;
      }
      .box {
        width: 100px;
        height: 100px;
        padding: 50px;
        border-radius: 50%;
      }
      .box1 {
        background-color: red;
      }

    </style>
  </head>
  <body>
    <div class="container">
      <div class="box box1"></div>
     
    </div>
  </body>
</html>
