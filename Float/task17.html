<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .left {
        float: left;
        width: 30%;
        height: 300px;
        background-color: lightblue;
        padding: 20px;
      }

      .right {
        float: right;
        width: 70%;
        height: 300px;
        background-color: lightgreen;
        padding: 20px;
      }

      .footer {
        clear: both;
        background-color: gray;
        color: white;
        text-align: center;
        padding: 20px;
      }
    </style>
  </head>

  <body>
    <div class="left">
      <h2>Left Sidebar</h2>
      <p>Menu items</p>
    </div>

    <div class="right">
      <h2>Main Content</h2>
      <p>This is the right content area.</p>
    </div>

    <footer class="footer">Footer Section</footer>
  </body>
</html>
