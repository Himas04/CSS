<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float</title>
    <style>
        .box1{
            float: right;
            padding: 50px;
            background-color: aqua;
        }
        .box2{
            float: left;
            background-color: aquamarine;
            padding: 50px;
        }
        .container{
            padding: 70px;
          
        }
        .container .box{
            float: left;
        }
    </style>
</head>
<body>
    <!-- Create two boxes. Float first left. -->
    <div>
        <div class="box1">Box1</div>
        <div class="box2">Box2</div>
    </div>

    
</body>
</html>
