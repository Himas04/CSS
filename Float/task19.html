<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <style>
        * {
            box-sizing: border-box;
        }

        .column {
            float: left;
            width: 33.33%;
            padding: 20px;
            height: 200px;
        }

        .one {
            background-color: lightblue;
        }

        .two {
            background-color: lightgreen;
        }

        .three {
            background-color: lightcoral;
        }

        .next-section {
            clear: both;
            background-color: gray;
            color: white;
            padding: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="column one">
        <h2>Column 1</h2>
        <p>Left content</p>
    </div>

    <div class="column two">
        <h2>Column 2</h2>
        <p>Middle content</p>
    </div>

    <div class="column three">
        <h2>Column 3</h2>
        <p>Right content</p>
    </div>


    <div class="next-section">
        <h2>Next Section</h2>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Assumenda quod earum esse est tempore dignissimos, dolor ab sint doloribus enim.</p>
    </div>

</body>
</html>
