<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            float: left;
            width: 23%;
            height: 120px;
            margin: 1%;
            background-color: lightblue;
            text-align: center;
            padding-top: 40px;
            box-sizing: border-box;
        }
        .box1{
            float: left;
            width: 30%;
            height: 120px;
            margin: 1%;
            background-color: lightblue;
            text-align: center;
            padding: 40px 0 0 0;
            box-sizing: border-box;
        }
        .box2{
            float: right;
            width: 40%;
            height: 120px;
            margin: 1%;
            background-color: lightblue;
            text-align: center;
            padding: 40px 0 0 0;
            box-sizing: border-box;
        }

        .clear {
            clear: both;
        }
        
    </style>
</head>

<body>

    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
    <div class="box">Box 4</div>
    <div class="box1">Box 5</div>
    <div class="box1">Box 6</div>
    <div class="box2">Box 7</div>
    <div class="box2">Box 8</div>

    <div class="clear"></div>

</body>
</html>
